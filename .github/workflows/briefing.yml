# FR-11 and BR-13: briefings go from 45 minutes before each business's slot (7:00 am or 6:00 pm Sydney time).
# Two runs per slot: the second only acts if the first was dropped or failed (NFR-09).
name: Briefing

on:
  schedule:
    - cron: '37 6 * * 1-5'
      timezone: 'Australia/Sydney'
    - cron: '52 6 * * 1-5'
      timezone: 'Australia/Sydney'
    - cron: '37 17 * * 1-5'
      timezone: 'Australia/Sydney'
    - cron: '52 17 * * 1-5'
      timezone: 'Australia/Sydney'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which Supabase project: dev (Test data and demonstrations) or pilot (owner testing)'
        required: true
        type: choice
        options: [dev, pilot]
        default: dev
      business_id:
        description: 'Business id (UUID) to brief now. Leave empty for every business that is due.'
        required: false
        type: string
      force:
        description: 'Send again even if today''s briefing already went'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  send:
    if: github.event_name == 'workflow_dispatch' || vars.JOBS_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Scheduled runs act on every project in JOB_TARGETS (["dev"] until owner testing, then ["dev","pilot"]);
        # "Run workflow" acts on the one project chosen in the form.
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.target) || vars.JOB_TARGETS || '["dev"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Send the briefings that are due
        run: node jobs/briefing.ts
        env:
          SUPABASE_URL: ${{ (matrix.target == 'pilot' && vars.SUPABASE_URL_PILOT) || (matrix.target == 'dev' && vars.SUPABASE_URL) || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ (matrix.target == 'pilot' && secrets.SUPABASE_SERVICE_ROLE_KEY_PILOT) || (matrix.target == 'dev' && secrets.SUPABASE_SERVICE_ROLE_KEY) || '' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          APP_URL: ${{ (matrix.target == 'pilot' && vars.APP_URL_PILOT) || (matrix.target == 'dev' && vars.APP_URL) || '' }}
          JOB_BUSINESS_ID: ${{ inputs.business_id }}
          JOB_FORCE: ${{ inputs.force }}
