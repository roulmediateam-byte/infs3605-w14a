# Daily at 9:17 am Sydney time: keep the free database awake, flag failed or stuck runs, and delete data that has
# reached its retention date (NFR-03, PD-7). Every business is deleted from Thu 31 Dec 2026.
name: Health check and retention

on:
  schedule:
    - cron: '17 9 * * *'
      timezone: 'Australia/Sydney'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which Supabase project: dev (Test data and demonstrations) or pilot (owner testing)'
        required: true
        type: choice
        options: [dev, pilot]
        default: dev
      force:
        description: 'Run again today'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.JOBS_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Scheduled runs act on every project in JOB_TARGETS (["dev"] until owner testing, then ["dev","pilot"]);
        # "Run workflow" acts on the one project chosen in the form.
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.target) || vars.JOB_TARGETS || '["dev"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Health check, then retention
        run: node jobs/health-check.ts
        env:
          SUPABASE_URL: ${{ (matrix.target == 'pilot' && vars.SUPABASE_URL_PILOT) || (matrix.target == 'dev' && vars.SUPABASE_URL) || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ (matrix.target == 'pilot' && secrets.SUPABASE_SERVICE_ROLE_KEY_PILOT) || (matrix.target == 'dev' && secrets.SUPABASE_SERVICE_ROLE_KEY) || '' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          JOB_FORCE: ${{ inputs.force }}
