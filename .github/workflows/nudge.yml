# FR-25 and BR-12 (Should): at 12:07 pm on a morning-briefing day, nudge the named checker once if drafts wait.
name: Checker nudge

on:
  schedule:
    - cron: '7 12 * * 1-5'
      timezone: 'Australia/Sydney'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nudge
  cancel-in-progress: false

jobs:
  nudge:
    if: github.event_name == 'workflow_dispatch' || vars.JOBS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Nudge checkers
        run: node jobs/nudge.ts
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          APP_URL: ${{ vars.APP_URL }}
